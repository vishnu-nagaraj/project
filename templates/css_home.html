<!DOCTYPE html>
<html>
<head>
    <title>Boston House Price Prediction</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            color: #333;
            overflow-x: hidden;
        }

        .main-container {
            display: flex;
            width: 100%;
            min-height: 100vh;
        }

        /* Left Side: Form */
        .form-section {
            width: 50%;
            padding: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-y: auto;
        }

        .form-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.2);
            width: 100%;
            max-width: 500px;
            max-height: 80vh;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: #ffffff80 #ffffff20;
        }

        .form-container::-webkit-scrollbar {
            width: 8px;
        }

        .form-container::-webkit-scrollbar-track {
            background: #ffffff20;
            border-radius: 10px;
        }

        .form-container::-webkit-scrollbar-thumb {
            background: #ffffff80;
            border-radius: 10px;
        }

        h1 {
            color: #fff;
            text-align: center;
            margin-bottom: 30px;
            font-size: 32px;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: linear-gradient(to right, #ff6f61, #ff9f43);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        .form-group {
            position: relative;
            margin-bottom: 20px;
        }

        label {
            color: #fff;
            font-weight: 500;
            font-size: 14px;
            display: block;
            margin-bottom: 5px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            border-color: #ff9f43;
            box-shadow: 0 0 8px rgba(255, 159, 67, 0.5);
            outline: none;
        }

        /* Tooltip */
        .tooltip {
            position: relative;
            display: inline-block;
            margin-left: 5px;
        }

        .tooltip .tooltiptext {
            visibility: hidden;
            width: 200px;
            background-color: #ff6f61;
            color: #fff;
            text-align: center;
            border-radius: 6px;
            padding: 8px;
            position: absolute;
            z-index: 1;
            bottom: 125%;
            left: 50%;
            transform: translateX(-50%);
            opacity: 0;
            transition: opacity 0.3s;
            font-size: 12px;
        }

        .tooltip:hover .tooltiptext {
            visibility: visible;
            opacity: 1;
        }

        .button-group {
            display: flex;
            gap: 10px;
        }

        input[type="submit"], input[type="reset"] {
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            flex: 1;
        }

        input[type="submit"] {
            background: #ff6f61;
            color: white;
        }

        input[type="submit"]:hover {
            background: #ff9f43;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 159, 67, 0.4);
        }

        input[type="reset"] {
            background: #6c757d;
            color: white;
        }

        input[type="reset"]:hover {
            background: #5a6268;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(108, 117, 125, 0.4);
        }

        /* Loading Spinner */
        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid #ff6f61;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        h2 {
            color: #2ecc71;
            text-align: center;
            margin-top: 20px;
            font-size: 20px;
            background: rgba(255, 255, 255, 0.9);
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            animation: pop 0.5s ease;
        }

        @keyframes pop {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Right Side: Parallax Background */
        .background-section {
            width: 50%;
            position: relative;
            overflow: hidden;
        }

        .parallax {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('https://images.unsplash.com/photo-1600585154347-be6161a56a0c?q=80&w=2070&auto=format&fit=crop') center center / cover;
            background-attachment: fixed;
            z-index: -1;
        }

        .parallax::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('https://images.unsplash.com/photo-1598228723793-52759bba239c?q=80&w=2074&auto=format&fit=crop') center center / cover;
            background-attachment: fixed;
            opacity: 0.5;
            z-index: -1;
        }

        /* Responsive Design */
        @media (max-width: 900px) {
            .main-container {
                flex-direction: column;
            }
            .form-section, .background-section {
                width: 100%;
            }
            .background-section {
                height: 300px;
            }
            .form-section {
                padding: 20px;
            }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="main-container">
        <!-- Form Section -->
        <div class="form-section">
            <div class="form-container">
                <h1>Boston House Price Prediction</h1>
                <form method="POST" action="/predict" onsubmit="showLoading()">
                    <!-- Original 13 features for the model -->
                    <div class="form-group">
                        <label>CRIM (Crime Rate):
                            <span class="tooltip">?
                                <span class="tooltiptext">Per capita crime rate by town</span>
                            </span>
                        </label>
                        <input type="text" name="crim" required>
                    </div>
                    <div class="form-group">
                        <label>ZN (Zoning):
                            <span class="tooltip">?
                                <span class="tooltiptext">Proportion of residential land zoned for lots over 25,000 sq.ft.</span>
                            </span>
                        </label>
                        <input type="text" name="zn" required>
                    </div>
                    <div class="form-group">
                        <label>INDUS (Industrial):
                            <span class="tooltip">?
                                <span class="tooltiptext">Proportion of non-retail business acres per town</span>
                            </span>
                        </label>
                        <input type="text" name="indus" required>
                    </div>
                    <div class="form-group">
                        <label>CHAS (Charles River):
                            <span class="tooltip">?
                                <span class="tooltiptext">1 if tract bounds river; 0 otherwise</span>
                            </span>
                        </label>
                        <input type="text" name="chas" required>
                    </div>
                    <div class="form-group">
                        <label>NOX (Nitric Oxides):
                            <span class="tooltip">?
                                <span class="tooltiptext">Nitric oxides concentration (parts per 10 million)</span>
                            </span>
                        </label>
                        <input type="text" name="nox" required>
                    </div>
                    <div class="form-group">
                        <label>RM (Rooms):
                            <span class="tooltip">?
                                <span class="tooltiptext">Average number of rooms per dwelling</span>
                            </span>
                        </label>
                        <input type="text" name="rm" required>
                    </div>
                    <div class="form-group">
                        <label>AGE (Age):
                            <span class="tooltip">?
                                <span class="tooltiptext">Proportion of owner-occupied units built prior to 1940</span>
                            </span>
                        </label>
                        <input type="text" name="age" required>
                    </div>
                    <div class="form-group">
                        <label>DIS (Distance):
                            <span class="tooltip">?
                                <span class="tooltiptext">Weighted distances to five Boston employment centers</span>
                            </span>
                        </label>
                        <input type="text" name="dis" required>
                    </div>
                    <div class="form-group">
                        <label>RAD (Radial Highways):
                            <span class="tooltip">?
                                <span class="tooltiptext">Index of accessibility to radial highways</span>
                            </span>
                        </label>
                        <input type="text" name="rad" required>
                    </div>
                    <div class="form-group">
                        <label>TAX (Tax Rate):
                            <span class="tooltip">?
                                <span class="tooltiptext">Full-value property-tax rate per $10,000</span>
                            </span>
                        </label>
                        <input type="text" name="tax" required>
                    </div>
                    <div class="form-group">
                        <label>PTRATIO (Pupil-Teacher):
                            <span class="tooltip">?
                                <span class="tooltiptext">Pupil-teacher ratio by town</span>
                            </span>
                        </label>
                        <input type="text" name="ptratio" required>
                    </div>
                    <div class="form-group">
                        <label>B (Black Population):
                            <span class="tooltip">?
                                <span class="tooltiptext">1000(Bk - 0.63)^2 where Bk is the proportion of Black population</span>
                            </span>
                        </label>
                        <input type="text" name="b" required>
                    </div>
                    <div class="form-group">
                        <label>LSTAT (Lower Status):
                            <span class="tooltip">?
                                <span class="tooltiptext">Percentage of lower status of the population</span>
                            </span>
                        </label>
                        <input type="text" name="lstat" required>
                    </div>

                    <!-- Additional fields for UI enhancement (not used in prediction) -->
                    <div class="form-group">
                        <label>Year Built:
                            <span class="tooltip">?
                                <span class="tooltiptext">Year the house was built (e.g., 1990)</span>
                            </span>
                        </label>
                        <input type="text" name="year_built" placeholder="e.g., 1990">
                    </div>
                    <div class="form-group">
                        <label>Neighborhood Quality (1-10):
                            <span class="tooltip">?
                                <span class="tooltiptext">Subjective quality of the neighborhood (1-10)</span>
                            </span>
                        </label>
                        <input type="text" name="neighborhood_quality" placeholder="e.g., 8">
                    </div>
                    <div class="form-group">
                        <label>Square Footage:
                            <span class="tooltip">?
                                <span class="tooltiptext">Total square footage of the house</span>
                            </span>
                        </label>
                        <input type="text" name="square_footage" placeholder="e.g., 2000">
                    </div>
                    <div class="form-group">
                        <label>Number of Floors:
                            <span class="tooltip">?
                                <span class="tooltiptext">Number of floors in the house</span>
                            </span>
                        </label>
                        <input type="text" name="floors" placeholder="e.g., 2">
                    </div>
                    <div class="form-group">
                        <label>Has Garage (0/1):
                            <span class="tooltip">?
                                <span class="tooltiptext">1 if the house has a garage, 0 otherwise</span>
                            </span>
                        </label>
                        <input type="text" name="has_garage" placeholder="e.g., 1">
                    </div>

                    <div class="button-group">
                        <input type="submit" value="Predict Price">
                        <input type="reset" value="Reset Form">
                    </div>
                </form>
                <div class="loading" id="loading">
                    <div class="spinner"></div>
                    <p style="color: #fff; margin-top: 10px;">Predicting...</p>
                </div>
                {% if prediction_text %}
                    <h2>{{ prediction_text }}</h2>
                {% endif %}
            </div>
        </div>

        <!-- Background Section -->
        <div class="background-section">
            <div class="parallax"></div>
        </div>
    </div>

    <script>
        function showLoading() {
            document.getElementById('loading').style.display = 'block';
        }
    </script>
</body>
</html>
