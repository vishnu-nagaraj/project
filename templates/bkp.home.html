<!DOCTYPE html>
<html>
<head>
    <title>Boston House Price Prediction</title>
    <style>
        body { font-family: Arial; margin: 20px; }
        label { display: inline-block; width: 150px; }
        input[type="text"] { margin: 5px; }
        input[type="submit"] { padding: 10px; background: #007BFF; color: white; border: none; }
    </style>
</head>
<body>
    <h1>Boston House Price Prediction</h1>
    <form method="POST" action="/predict">
        <label>CRIM (Crime Rate):</label><input type="text" name="crim" required><br>
        <label>ZN (Zoning):</label><input type="text" name="zn" required><br>
        <label>INDUS (Industrial):</label><input type="text" name="indus" required><br>
        <label>CHAS (Charles River):</label><input type="text" name="chas" required><br>
        <label>NOX (Nitric Oxides):</label><input type="text" name="nox" required><br>
        <label>RM (Rooms):</label><input type="text" name="rm" required><br>
        <label>AGE (Age):</label><input type="text" name="age" required><br>
        <label>DIS (Distance):</label><input type="text" name="dis" required><br>
        <label>RAD (Radial Highways):</label><input type="text" name="rad" required><br>
        <label>TAX (Tax Rate):</label><input type="text" name="tax" required><br>
        <label>PTRATIO (Pupil-Teacher):</label><input type="text" name="ptratio" required><br>
        <label>B (Black Population):</label><input type="text" name="b" required><br>
        <label>LSTAT (Lower Status):</label><input type="text" name="lstat" required><br>
        <input type="submit" value="Predict">
    </form>
    {% if prediction_text %}
        <h2>{{ prediction_text }}</h2>
    {% endif %}
</body>
</html>
